name: Keep Supabase Alive

on:
  schedule:
    # Roda a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Relatorios e Favorita Almoxarifado
        run: |
          TIMESTAMP=$(date +%s)
          curl -s -L "https://relatorios-ferdata.vercel.app/api/keepalive?t=$TIMESTAMP"
          echo ""
          curl -s -L "https://favorita-almoxarifado.vercel.app/api/keepalive?t=$TIMESTAMP"
